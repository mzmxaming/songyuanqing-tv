name: Build All Platforms

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  windows:
    name: Windows Package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Windows installers
        run: ./gradlew :desktop:createDistributable :desktop:packageMsi :desktop:packageExe --stacktrace

      - name: Dump packaging logs on failure
        if: failure()
        shell: pwsh
        run: |
          Get-ChildItem -Recurse desktop/build/compose/logs -ErrorAction SilentlyContinue | ForEach-Object {
            Write-Output "===== $($_.FullName) ====="
            Get-Content $_.FullName -ErrorAction SilentlyContinue
          }

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item -Recurse -Force desktop/build/compose/binaries/main/app/SongyuanqingTV dist/SongyuanqingTV-portable
          Compress-Archive -Force -Path dist/SongyuanqingTV-portable -DestinationPath dist/SongyuanqingTV-windows-portable.zip
          Get-ChildItem desktop/build/compose/binaries/main/msi/*.msi -ErrorAction SilentlyContinue | Copy-Item -Destination dist
          Get-ChildItem desktop/build/compose/binaries/main/exe/*.exe -ErrorAction SilentlyContinue | Copy-Item -Destination dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: dist/**
          if-no-files-found: warn

  macos:
    name: macOS Package
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build macOS dmg
        run: ./gradlew :desktop:packageDmg :desktop:createDistributable --stacktrace

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-packages
          path: |
            desktop/build/compose/binaries/main/dmg/*.dmg
            desktop/build/compose/binaries/main/app/**
          if-no-files-found: warn

  ios:
    name: iOS App
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile iOS targets
        run: |
          ./gradlew :shared:linkDebugFrameworkIosSimulatorArm64 :shared:linkDebugFrameworkIosArm64 --stacktrace

      - name: Build iOS app for simulator (unsigned)
        run: |
          cd iosApp
          xcodebuild -project iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Upload iOS frameworks
        uses: actions/upload-artifact@v4
        with:
          name: ios-frameworks
          path: |
            shared/build/bin/ios*/**/*.framework
            iosApp/build/Debug-iphonesimulator/*.app
          if-no-files-found: warn

  linux:
    name: Linux Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot rpm

      - name: Build Linux packages
        run: ./gradlew :desktop:packageDeb :desktop:packageRpm :desktop:createDistributable --stacktrace

      - name: Dump packaging logs on failure
        if: failure()
        run: |
          find desktop/build/compose/logs -type f -exec sh -c 'echo "===== $1 ====="; cat "$1"' _ {} \; || true

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp desktop/build/compose/binaries/main/deb/*.deb dist/ 2>/dev/null || true
          cp desktop/build/compose/binaries/main/rpm/*.rpm dist/ 2>/dev/null || true
          APP=$(ls -d desktop/build/compose/binaries/main/app/*/ | head -n 1)
          APP=${APP%/}
          tar -czf dist/songyuanqing-tv-linux-portable.tar.gz -C "$(dirname "$APP")" "$(basename "$APP")"
          echo "--- 产物目录 ---"
          find desktop/build/compose/binaries/main -maxdepth 2 -type d
          ls -lh dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: dist/**
          if-no-files-found: warn

  ios-signed:
    name: iOS Signed IPA
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    # 证书与描述文件只放在 Secrets 中，绝不入库
    env:
      TEAM_ID: LWGNB3QJ4H
      BUNDLE_ID: app.rainbow8311.peach5135
      PROFILE_UUID: eaf0b50a-3cc1-4660-ae87-5fc686206a4b
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Import signing certificate and profile
        env:
          P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/signing.p12"
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"
          printf '%s' "$P12_BASE64" | openssl base64 -d -A -out "$CERT_PATH"
          printf '%s' "$PROFILE_BASE64" | openssl base64 -d -A -out "$PROFILE_PATH"

          # 现代工具导出的 p12 使用 PBES2/SHA-256，macOS 的 security import 会报 MAC 校验失败；
          # 先转成 3DES + SHA1 的兼容格式再导入。
          OPENSSL_BIN="$(command -v openssl)"
          for candidate in /opt/homebrew/opt/openssl@3/bin/openssl /usr/local/opt/openssl@3/bin/openssl; do
            if [ -x "$candidate" ]; then OPENSSL_BIN="$candidate"; break; fi
          done
          "$OPENSSL_BIN" version
          "$OPENSSL_BIN" pkcs12 -in "$CERT_PATH" -nodes -passin "pass:$P12_PASSWORD" -out "$RUNNER_TEMP/signing.pem"
          if ! "$OPENSSL_BIN" pkcs12 -export -legacy -in "$RUNNER_TEMP/signing.pem" -name "iPhone Distribution" \
                -out "$RUNNER_TEMP/signing-legacy.p12" -passout "pass:$P12_PASSWORD"; then
            "$OPENSSL_BIN" pkcs12 -export -in "$RUNNER_TEMP/signing.pem" -name "iPhone Distribution" \
              -out "$RUNNER_TEMP/signing-legacy.p12" -passout "pass:$P12_PASSWORD" \
              -keypbe PBE-SHA1-3DES -certpbe PBE-SHA1-3DES -macalg sha1
          fi

          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/signing-legacy.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Archive
        run: |
          cd iosApp
          xcodebuild -project iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/iosApp.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="iPhone Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            archive

      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/iosApp.xcarchive" \
            -exportOptionsPlist iosApp/ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/ipa"

      - name: Rename IPA
        run: |
          cd "$RUNNER_TEMP/ipa"
          for f in *.ipa; do mv "$f" "SongyuanqingTV-1.2.0.ipa"; done
          ls -lh

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-signed
          path: ${{ runner.temp }}/ipa/*.ipa
          if-no-files-found: warn

  release:
    name: Publish Release
    if: always() && startsWith(github.ref, 'refs/tags/v')
    needs: [ windows, macos, linux, ios-signed ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/windows-packages/*.msi
            release-assets/windows-packages/*.exe
            release-assets/windows-packages/*.zip
            release-assets/macos-packages/dmg/*.dmg
            release-assets/linux-packages/*.deb
            release-assets/linux-packages/*.rpm
            release-assets/linux-packages/*.tar.gz
            release-assets/ios-signed/*.ipa
          fail_on_unmatched_files: false
          draft: false
          generate_release_notes: true
