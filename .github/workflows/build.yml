name: Build All Platforms

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  windows:
    name: Windows Package (x86_64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Windows installers
        run: ./gradlew :desktop:createDistributable :desktop:packageMsi :desktop:packageExe --stacktrace

      - name: Dump packaging logs on failure
        if: failure()
        shell: pwsh
        run: |
          Get-ChildItem -Recurse desktop/build/compose/logs -ErrorAction SilentlyContinue | ForEach-Object {
            Write-Output "===== $($_.FullName) ====="
            Get-Content $_.FullName -ErrorAction SilentlyContinue
          }

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item -Recurse -Force desktop/build/compose/binaries/main/app/SongyuanqingTV dist/SongyuanqingTV-portable
          Compress-Archive -Force -Path dist/SongyuanqingTV-portable -DestinationPath dist/SongyuanqingTV-windows-portable.zip
          Get-ChildItem desktop/build/compose/binaries/main/msi/*.msi -ErrorAction SilentlyContinue | Copy-Item -Destination dist
          Get-ChildItem desktop/build/compose/binaries/main/exe/*.exe -ErrorAction SilentlyContinue | Copy-Item -Destination dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: dist/**
          if-no-files-found: warn

  macos-arm64:
    name: macOS Package (arm64 / Apple Silicon)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build macOS dmg (arm64)
        run: ./gradlew :desktop:packageDmg :desktop:createDistributable --stacktrace

      - name: Rename artifacts with arch suffix
        run: |
          echo "host arch: $(uname -m)"
          cd desktop/build/compose/binaries/main/dmg
          for f in *.dmg; do
            base="${f%.dmg}"
            mv "$f" "${base}-arm64.dmg"
          done
          ls -lh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-packages
          path: |
            desktop/build/compose/binaries/main/dmg/*.dmg
          if-no-files-found: warn

  macos-intel:
    name: macOS Package (x86_64 / Intel)
    # macos-13 已被 GitHub 下线（作业会永久排队），Intel 镜像改用 macos-15-intel
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build macOS dmg (x86_64)
        run: ./gradlew :desktop:packageDmg :desktop:createDistributable --stacktrace

      - name: Rename artifacts with arch suffix
        run: |
          echo "host arch: $(uname -m)"
          cd desktop/build/compose/binaries/main/dmg
          for f in *.dmg; do
            base="${f%.dmg}"
            mv "$f" "${base}-x86_64.dmg"
          done
          ls -lh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-intel-packages
          path: |
            desktop/build/compose/binaries/main/dmg/*.dmg
          if-no-files-found: warn

  ios:
    name: iOS App
    # tag 推送时由 ios-signed 覆盖真机构建，模拟器构建仅在分支/PR 时运行，避免占用 macOS runner 配额
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile iOS targets
        run: |
          ./gradlew :shared:linkDebugFrameworkIosSimulatorArm64 :shared:linkDebugFrameworkIosArm64 --stacktrace

      - name: Build iOS app for simulator (unsigned)
        run: |
          cd iosApp
          xcodebuild -project iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Upload iOS frameworks
        uses: actions/upload-artifact@v4
        with:
          name: ios-frameworks
          path: |
            shared/build/bin/ios*/**/*.framework
            iosApp/build/Debug-iphonesimulator/*.app
          if-no-files-found: warn

  linux:
    name: Linux Package (x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot rpm

      - name: Bundle libVLC for Linux package
        run: |
          # 在 Ubuntu 20.04 容器里取 libVLC 及插件（与银河麒麟 V10 SP1 同代 glibc），
          # 让 Linux 包也做到开箱即播，不再依赖用户系统安装 VLC。
          docker run --rm -v "$GITHUB_WORKSPACE:/ws" -w /ws ubuntu:20.04 \
            bash scripts/prepare-linux-vlc.sh
          # 容器以 root 建目录，交还给 runner 用户，否则后续 Gradle 无法写入
          sudo chown -R "$(id -u):$(id -g)" desktop/build

      - name: Build Linux packages
        run: ./gradlew :desktop:packageDeb :desktop:packageRpm :desktop:createDistributable --stacktrace

      - name: Dump packaging logs on failure
        if: failure()
        run: |
          find desktop/build/compose/logs -type f -exec sh -c 'echo "===== $1 ====="; cat "$1"' _ {} \; || true

      - name: Patch deb dependencies for Debian 10 / 麒麟 V10
        run: |
          # Ubuntu 24.04 把 libasound2 / libpng16-16 改名成 t64 后缀，麒麟 V10、Debian 10 上并不存在；
          # 改写成 dpkg 的二选一依赖，两种系统都能装。libmd0 经实测无任何 ELF 引用，直接移除。
          shopt -s nullglob
          for deb in desktop/build/compose/binaries/main/deb/*.deb; do
            work=$(mktemp -d)
            dpkg-deb -R "$deb" "$work/pkg"
            ctl="$work/pkg/DEBIAN/control"
            sed -i 's/libasound2t64/libasound2t64 | libasound2/g' "$ctl"
            sed -i 's/libpng16-16t64/libpng16-16t64 | libpng16-16/g' "$ctl"
            sed -i 's/libmd0, //g; s/, libmd0//g' "$ctl"
            dpkg-deb -b "$work/pkg" "$work/patched.deb" > /dev/null
            mv "$work/patched.deb" "$deb"
            echo "--- $(basename "$deb") ---"
            dpkg-deb -f "$deb" Depends
            rm -rf "$work"
          done

      - name: Collect artifacts
        run: |
          echo "host arch: $(uname -m)"
          mkdir -p dist
          cp desktop/build/compose/binaries/main/deb/*.deb dist/ 2>/dev/null || true
          cp desktop/build/compose/binaries/main/rpm/*.rpm dist/ 2>/dev/null || true
          APP=$(ls -d desktop/build/compose/binaries/main/app/*/ | head -n 1)
          APP=${APP%/}
          tar -czf dist/songyuanqing-tv-linux-portable-amd64.tar.gz -C "$(dirname "$APP")" "$(basename "$APP")"
          echo "--- 产物目录 ---"
          find desktop/build/compose/binaries/main -maxdepth 2 -type d
          ls -lh dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: dist/**
          if-no-files-found: warn

  linux-arm64:
    name: Linux Package (aarch64 / ARM64)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          architecture: aarch64

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot rpm

      - name: Bundle libVLC for Linux package
        run: |
          # 同上，arm64 由 Docker 自动拉取对应架构的 ubuntu:20.04 镜像
          docker run --rm -v "$GITHUB_WORKSPACE:/ws" -w /ws ubuntu:20.04 \
            bash scripts/prepare-linux-vlc.sh
          sudo chown -R "$(id -u):$(id -g)" desktop/build

      - name: Build Linux packages (aarch64)
        run: ./gradlew :desktop:packageDeb :desktop:packageRpm :desktop:createDistributable --stacktrace

      - name: Dump packaging logs on failure
        if: failure()
        run: |
          find desktop/build/compose/logs -type f -exec sh -c 'echo "===== $1 ====="; cat "$1"' _ {} \; || true

      - name: Patch deb dependencies for Debian 10 / 麒麟 V10
        run: |
          # Ubuntu 24.04 把 libasound2 / libpng16-16 改名成 t64 后缀，麒麟 V10、Debian 10 上并不存在；
          # 改写成 dpkg 的二选一依赖，两种系统都能装。libmd0 经实测无任何 ELF 引用，直接移除。
          shopt -s nullglob
          for deb in desktop/build/compose/binaries/main/deb/*.deb; do
            work=$(mktemp -d)
            dpkg-deb -R "$deb" "$work/pkg"
            ctl="$work/pkg/DEBIAN/control"
            sed -i 's/libasound2t64/libasound2t64 | libasound2/g' "$ctl"
            sed -i 's/libpng16-16t64/libpng16-16t64 | libpng16-16/g' "$ctl"
            sed -i 's/libmd0, //g; s/, libmd0//g' "$ctl"
            dpkg-deb -b "$work/pkg" "$work/patched.deb" > /dev/null
            mv "$work/patched.deb" "$deb"
            echo "--- $(basename "$deb") ---"
            dpkg-deb -f "$deb" Depends
            rm -rf "$work"
          done

      - name: Collect artifacts
        run: |
          echo "host arch: $(uname -m)"
          mkdir -p dist
          cp desktop/build/compose/binaries/main/deb/*.deb dist/ 2>/dev/null || true
          cp desktop/build/compose/binaries/main/rpm/*.rpm dist/ 2>/dev/null || true
          APP=$(ls -d desktop/build/compose/binaries/main/app/*/ | head -n 1)
          APP=${APP%/}
          tar -czf dist/songyuanqing-tv-linux-portable-arm64.tar.gz -C "$(dirname "$APP")" "$(basename "$APP")"
          echo "--- 产物目录 ---"
          find desktop/build/compose/binaries/main -maxdepth 2 -type d
          ls -lh dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-arm64-packages
          path: dist/**
          if-no-files-found: warn

  ios-signed:
    name: iOS Signed IPA
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    # 证书与描述文件只放在 Secrets 中，绝不入库
    env:
      TEAM_ID: LWGNB3QJ4H
      BUNDLE_ID: app.rainbow8311.peach5135
      PROFILE_UUID: eaf0b50a-3cc1-4660-ae87-5fc686206a4b
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Import signing certificate and profile
        env:
          P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/signing.p12"
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"
          printf '%s' "$P12_BASE64" | openssl base64 -d -A -out "$CERT_PATH"
          printf '%s' "$PROFILE_BASE64" | openssl base64 -d -A -out "$PROFILE_PATH"

          # 现代工具导出的 p12 使用 PBES2/SHA-256，macOS 的 security import 会报 MAC 校验失败；
          # 先转成 3DES + SHA1 的兼容格式再导入。
          OPENSSL_BIN="$(command -v openssl)"
          for candidate in /opt/homebrew/opt/openssl@3/bin/openssl /usr/local/opt/openssl@3/bin/openssl; do
            if [ -x "$candidate" ]; then OPENSSL_BIN="$candidate"; break; fi
          done
          "$OPENSSL_BIN" version
          "$OPENSSL_BIN" pkcs12 -in "$CERT_PATH" -nodes -passin "pass:$P12_PASSWORD" -out "$RUNNER_TEMP/signing.pem"
          if ! "$OPENSSL_BIN" pkcs12 -export -legacy -in "$RUNNER_TEMP/signing.pem" -name "iPhone Distribution" \
                -out "$RUNNER_TEMP/signing-legacy.p12" -passout "pass:$P12_PASSWORD"; then
            "$OPENSSL_BIN" pkcs12 -export -in "$RUNNER_TEMP/signing.pem" -name "iPhone Distribution" \
              -out "$RUNNER_TEMP/signing-legacy.p12" -passout "pass:$P12_PASSWORD" \
              -keypbe PBE-SHA1-3DES -certpbe PBE-SHA1-3DES -macalg sha1
          fi

          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/signing-legacy.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Archive
        run: |
          cd iosApp
          xcodebuild -project iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/iosApp.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="iPhone Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            archive

      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/iosApp.xcarchive" \
            -exportOptionsPlist iosApp/ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/ipa"

      - name: Rename IPA
        run: |
          cd "$RUNNER_TEMP/ipa"
          for f in *.ipa; do mv "$f" "SongyuanqingTV-1.2.6.ipa"; done
          ls -lh

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-signed
          path: ${{ runner.temp }}/ipa/*.ipa
          if-no-files-found: warn

  release:
    name: Publish Release
    if: always() && startsWith(github.ref, 'refs/tags/v')
    needs: [ windows, macos-arm64, macos-intel, linux, linux-arm64, ios-signed ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/windows-packages/*.msi
            release-assets/windows-packages/*.exe
            release-assets/windows-packages/*.zip
            release-assets/macos-arm64-packages/*.dmg
            release-assets/macos-intel-packages/*.dmg
            release-assets/linux-packages/*.deb
            release-assets/linux-packages/*.rpm
            release-assets/linux-packages/*.tar.gz
            release-assets/linux-arm64-packages/*.deb
            release-assets/linux-arm64-packages/*.rpm
            release-assets/linux-arm64-packages/*.tar.gz
            release-assets/ios-signed/*.ipa
          fail_on_unmatched_files: false
          draft: false
          generate_release_notes: true
